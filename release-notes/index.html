          </div>
          <div class="top-actions">
            <button class="btn btn-primary" type="button" data-href="/rfqs/new" data-action="deeplink">
              <span class="btn-label">New RFQ</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="icon-btn" type="button" aria-label="Notifications">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
            </button>
            <button class="icon-btn" type="button" aria-label="Feedback">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 16.5 4 20l3.8-1.2A8 8 0 1 0 6 16.5Z"/></svg>
            </button>
            <button class="avatar" type="button" aria-label="Account menu">AM</button>
          </div>
        </header>
        <main id="view"></main>
      </div>
    </div>
  </div>
  <div class="whats-new-wrap">
    <div class="pop" id="whats-new-pop" role="dialog" aria-label="Latest release notes" hidden></div>
    <button class="whats-new-fab" id="whats-new-btn" type="button" data-action="popover" aria-haspopup="dialog" aria-expanded="false" aria-label="What's new">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 13.4 8 18 9.4 13.4 10.8 12 15.2 10.6 10.8 6 9.4 10.6 8 12 3.5Z"/><path d="M18 14.5 18.7 16.8 19 17.1 18.7 17.4 18 19.7 17.3 17.4 17 17.1 17.3 16.8 18 14.5Z"/></svg>
      <span class="fab-count" data-unread-count hidden>0</span>
    </button>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="notes.js"></script>
  <script src="app.js"></script>
</body>
