<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astra · Silq</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gray-0: #fff;
      --gray-100: #f8f8f8;
      --gray-150: #f2f2f2;
      --gray-250: #e0e0e0;
      --gray-400: #b1b1b1;
      --gray-500: #909090;
      --gray-600: #6c6c6c;
      --gray-700: #464646;
      --gray-800: #202020;
      --app-bg: #f5f6f7;
      --navy: #042868;
      --brand: #ef6445;
      --info: #334bfa;
      --success: #299446;
      --warning: #f49d1a;
      --error: #cf222e;
      --shadow-nav: 2px 2px 0 0 rgba(0, 0, 0, 0.15), 1px 1px 2px 0 rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--app-bg);
      color: var(--gray-800);
      font-size: 14px;
    }
    button { font-family: inherit; cursor: pointer; }
    .app {
      display: grid;
      grid-template-columns: 208px minmax(0, 1fr);
      height: 100%;
      min-height: 0;
    }
    .app.is-collapsed { grid-template-columns: 88px minmax(0, 1fr); }
    .sidebar {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-height: 0;
      padding: 24px 0 20px;
    }
    .org {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      margin: 0 20px;
    }
    .org-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .collapse-btn, .org-mark {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--gray-500);
    }
    .org-mark { display: none; width: 32px; height: 32px; background: var(--gray-800); color: white; font-size: 13px; font-weight: 600; }
    .nav-scroll {
      overflow: auto;
      margin: 24px 0;
      padding: 0 20px;
      display: grid;
      align-content: start;
      gap: 24px;
    }
    .nav-primary, .nav-groups { display: grid; gap: 8px; align-content: start; }
    .nav-groups { gap: 12px; }
    .nav-link, .group-head, .nav-child {
      display: grid;
      align-items: center;
      height: 30px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--gray-800);
      text-align: left;
    }
    .nav-link, .group-head {
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 4px;
      padding: 0 4px;
      font-size: 14px;
    }
    .group-head { cursor: pointer; }
    .nav-link svg, .group-head svg { display: block; }
    .nav-link:hover, .group-head:hover, .nav-child:hover { background: rgba(0, 0, 0, 0.05); }
    .chevron { opacity: 0; transition: transform 0.15s; }
    .nav-block:hover .chevron, .nav-block.is-open .chevron { opacity: 1; }
    .nav-block.is-open .chevron { transform: rotate(180deg); }
    .nav-sub { display: none; gap: 4px; padding-top: 4px; }
    .nav-block.is-open .nav-sub { display: grid; }
    .nav-child {
      margin-left: 22px;
      padding: 0 10px;
      font-size: 14px;
    }
    .nav-child.is-selected {
      background: white;
      border-color: var(--navy);
      box-shadow: var(--shadow-nav);
    }
    .app.is-collapsed .org { grid-template-columns: 1fr; justify-items: center; }
    .app.is-collapsed .org-name,
    .app.is-collapsed .collapse-btn,
    .app.is-collapsed .nav-link span,
    .app.is-collapsed .group-head span,
    .app.is-collapsed .chevron,
    .app.is-collapsed .nav-sub,
    .app.is-collapsed .powered span,
    .app.is-collapsed .wordmark { display: none; }
    .app.is-collapsed .org-mark,
    .app.is-collapsed .bird { display: grid; }
    .app.is-collapsed .group-head,
    .app.is-collapsed .nav-link { grid-template-columns: 24px; justify-content: center; }
    .powered {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 20px;
      color: var(--gray-500);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .bird { display: none; }
    .canvas-wrap { min-width: 0; min-height: 0; padding: 12px 12px 0 0; }
    .canvas {
      height: 100%;
      min-height: 0;
      background: white;
      border: 1px solid var(--gray-250);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 56px;
      padding: 0 20px;
      border-bottom: 1px solid var(--gray-150);
    }
    .page-title { font-size: 16px; font-weight: 600; }
    .sample-pill {
      border: 0;
      border-radius: 999px;
      background: #fef5e8;
      color: #996c00;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
    }
    main { overflow: auto; padding: 20px 24px 40px; }
    .lede {
      margin: 0 0 16px;
      color: var(--gray-600);
      font-size: 13px;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .kpis + .kpis { margin-bottom: 20px; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
    .stat { background: var(--gray-100); border-radius: 10px; padding: 12px 14px; }
    .stat span { display: block; color: var(--gray-600); font-size: 12px; margin-bottom: 4px; }
    .stat strong { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
    .stat em { display: block; margin-top: 4px; font-style: normal; color: var(--gray-500); font-size: 12px; }
    .kpis.five { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 20px; }
    .kpi {
      position: relative;
      background: var(--gray-100);
      border-radius: 10px;
      padding: 12px 14px;
      text-decoration: none;
      color: inherit;
    }
    .kpi:hover { background: var(--gray-150); }
    .kpi span { display: block; color: var(--gray-600); font-size: 12px; margin-bottom: 6px; }
    .kpi strong { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
    .kpi em { display: block; margin-top: 4px; font-style: normal; color: var(--gray-500); font-size: 12px; }
    .kpi .tip {
      display: none;
      position: absolute;
      z-index: 6;
      top: calc(100% + 8px);
      left: 0;
      width: 240px;
      margin: 0;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--gray-800);
      color: white;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
    }
    .kpi .tip::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 18px;
      border: 5px solid transparent;
      border-top: 0;
      border-bottom-color: var(--gray-800);
    }
    .kpi:hover .tip,
    .kpi:focus-visible .tip { display: block; }
    .kpis .kpi:nth-child(n + 5) .tip,
    .kpis.five .kpi:nth-child(n + 4) .tip { left: auto; right: 0; }
    .kpis .kpi:nth-child(n + 5) .tip::before,
    .kpis.five .kpi:nth-child(n + 4) .tip::before { left: auto; right: 18px; }
    .section { margin-top: 28px; }
    .section h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    .section .note { margin: 0 0 12px; color: var(--gray-600); font-size: 13px; }
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .tiles + .tiles, .tiles + .tile { margin-top: 12px; }
    .tiles.two { grid-template-columns: 1.4fr 1fr; }
    .tile {
      border: 1px solid var(--gray-250);
      border-radius: 10px;
      padding: 14px;
      background: white;
      min-width: 0;
      overflow-x: auto;
    }
    .tile h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; color: var(--gray-600); font-size: 12px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    svg.chart { width: 100%; height: 168px; display: block; }
    .axis { fill: var(--gray-500); font-size: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--gray-150); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--gray-600); font-weight: 500; font-size: 12px; }
    td.blank { color: var(--gray-400); }
    table.plain th, table.plain td { text-align: left; vertical-align: top; }
    table.plain th.num, table.plain td.num { text-align: right; }
    table.plain td.num { white-space: nowrap; }
    table.plain td.muted { color: var(--gray-600); }
    .section .tile + .tile { margin-top: 12px; }
    table.queries td:nth-child(1) { white-space: nowrap; }
    .sub { color: var(--gray-600); font-size: 12px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .seg { display: inline-flex; padding: 2px; background: var(--gray-150); border-radius: 8px; }
    .seg button {
      border: 0;
      background: transparent;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--gray-700);
    }
    .seg button.is-on { background: white; font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
    .heat-wrap { overflow-x: auto; }
    .heat {
      display: grid;
      grid-template-columns: 72px repeat(24, minmax(18px, 1fr));
      gap: 3px;
      min-width: 640px;
      align-items: center;
    }
    .heat .hlabel, .heat .dlabel { font-size: 10px; color: var(--gray-500); }
    .heat .hlabel { text-align: center; }
    .cell { height: 18px; border-radius: 3px; }
    .bars { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; min-width: 640px; height: 72px; align-items: end; margin-top: 8px; }
    .bars i { display: block; background: #c4d4f5; border-radius: 2px 2px 0 0; }
    .stack { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; min-width: 640px; height: 88px; align-items: end; }
    .stack b { display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start; }
    .stack span { display: block; width: 100%; }
    .topic { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(64px, 1fr) 52px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
    .topic.wide { grid-template-columns: minmax(0, 1.15fr) minmax(64px, 1fr) 52px; }
    .topic > span { min-width: 0; }
    .track { height: 8px; background: var(--gray-150); border-radius: 99px; overflow: hidden; }
    .track span { display: block; height: 100%; background: var(--info); border-radius: 99px; }
    .topic strong { font-weight: 500; text-align: right; }
    @media (max-width: 1100px) {
      .kpis, .kpis + .kpis, .kpis.five, .tiles, .tiles.two, .stats { grid-template-columns: 1fr 1fr; }
      .kpis .kpi:nth-child(n + 5) .tip,
      .kpis.five .kpi:nth-child(n + 4) .tip { left: 0; right: auto; }
      .kpis .kpi:nth-child(even) .tip,
      .kpis.five .kpi:nth-child(even) .tip { left: auto; right: 0; }
      .kpis .kpi:nth-child(n + 5) .tip::before,
      .kpis.five .kpi:nth-child(n + 4) .tip::before { left: 18px; right: auto; }
      .kpis .kpi:nth-child(even) .tip::before,
      .kpis.five .kpi:nth-child(even) .tip::before { left: auto; right: 18px; }
    }
    @media (max-width: 800px) {
      .app, .app.is-collapsed { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .canvas-wrap { padding: 0; }
      .kpis, .kpis + .kpis, .kpis.five, .tiles, .tiles.two, .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>

        </button>

          <button class="nav-link" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19.3 7H5.7a.8.8 0 0 0 0 1.5h.9v8H5.7a.8.8 0 0 0 0 1.5h13.6a.8.8 0 0 0 0-1.5h-.9v-8h.9a.8.8 0 0 0 0-1.5ZM8.1 16.5h8.8v-8H8.1v8Z"/></svg><span>Shipments</span></button>
          <button class="nav-link" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 17.1V15.3a.8.8 0 0 1 1.5 0v1.8a1 1 0 0 0 1 1h2.6a.8.8 0 0 1 0 1.5H9a2.5 2.5 0 0 1-2.5-2.5Zm8.7-6.8 1 1a.8.8 0 0 1 0 1.1l-3.7 3.7a.8.8 0 0 1-1.1 0l-1.8-1.8a.8.8 0 0 1 1.1-1.1l1.2 1.3 3.3-3.2Z"/></svg><span>Inspections</span></button>

            <div class="nav-sub">
              <button class="nav-child" type="button">Reports</button>
              <button class="nav-child" type="button">Analytics</button>
              <button class="nav-child is-selected" type="button">Astra</button>
            </div>
          </div>
          <div class="nav-block" data-group="business">
            <button class="group-head" type="button" data-go="toggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20h16M7 20V8h4v12M13 20V4h4v16"/></svg><span>My business</span><svg class="chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-linecap="round"/></svg></button>

            <button class="group-head" type="button" data-go="toggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 7h11M9 12h11M9 17h11M4 7h.01M4 12h.01M4 17h.01"/></svg><span>Tasks</span><svg class="chevron" width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-linecap="round"/></svg></button>

    const state = { window: 7 };

    function failRate(dow, hour, days) {
      const night = hour < 6 || hour >= 23;
      const peak = hour >= 9 && hour <= 18;
      let rate = peak ? 0.7 : night ? 3.4 : 1.5;
      if (dow >= 6) rate += 0.5;
      if (dow === 1 && hour === 9) rate = 2.4;
      if (days === 28) rate = rate * 0.8 + 0.15;
      return Math.round(rate * 100) / 100;
    }

    function volume(dow, hour) {
      const peak = hour >= 9 && hour <= 18;
      const base = peak ? 420 : hour < 6 ? 18 : 90;
      return Math.round(base * (dow >= 6 ? 0.4 : 1));
    }

    function heatColor(rate) {
      if (rate < 1) return "#eaf6ed";
      if (rate < 2) return "#fef5e8";
      if (rate < 3) return "#f8d7a8";
      return "#f4c7cb";
    }

    function chart(series, labels) {
      const w = 560;
      const h = 168;
      const pad = { l: 32, r: 8, t: 12, b: 22 };
      const all = series.flatMap((item) => item.values);
      const max = Math.max(...all) * 1.2 || 1;
      const innerW = w - pad.l - pad.r;
      const innerH = h - pad.t - pad.b;
      const x = (i, n) => pad.l + (n === 1 ? innerW / 2 : (i * innerW) / (n - 1));
      const y = (v) => pad.t + innerH - (v / max) * innerH;
      const lines = series.map((item) => {
        const pts = item.values.map((v, i) => [x(i, item.values.length), y(v), v]);
        const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
        const dots = pts.map((p) => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.5" fill="' + item.color + '"><title>' + item.name + " " + p[2] + "</title></circle>").join("");
        return '<path d="' + d + '" fill="none" stroke="' + item.color + '" stroke-width="2"/>' + dots;
      }).join("");
      const first = labels[0] || "";
      const last = labels[labels.length - 1] || "";
      return '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" role="img">' +
        '<line x1="' + pad.l + '" y1="' + (h - pad.b) + '" x2="' + (w - pad.r) + '" y2="' + (h - pad.b) + '" stroke="#ebebeb"/>' +
        lines +
        '<text class="axis" x="' + pad.l + '" y="' + (h - 6) + '">' + first + "</text>" +
        '<text class="axis" x="' + (w - pad.r) + '" y="' + (h - 6) + '" text-anchor="end">' + last + "</text>" +
        '<text class="axis" x="4" y="' + (pad.t + 8) + '">' + Math.round(max) + "</text>" +
        "</svg>";
    }

    function legend(items) {
      return '<div class="legend">' + items.map((item) => '<span><i class="swatch" style="background:' + item[1] + '"></i>' + item[0] + "</span>").join("") + "</div>";
    }

    function topics(kind) {
      const index = kind === "share" ? 1 : kind === "feedback" ? 2 : kind === "missed" ? 4 : 3;
      const rows = TOPICS.slice().sort((a, b) => b[index] - a[index]);
      const max = rows[0][index];
      return rows.map((row) => {
        const width = Math.max(4, (row[index] / max) * 100);
        return '<div class="topic"><span>' + row[0] + '</span><div class="track"><span style="width:' + width + '%"></span></div><strong>' + row[index].toFixed(1) + "%</strong></div>";
      }).join("");
    }

    function shareBars(rows, asCount) {
      const max = Math.max(...rows.map((row) => row[1]));
      return rows.map((row) => {
        const width = Math.max(4, (row[1] / max) * 100);
        const label = asCount ? String(row[1]) : row[1].toFixed(1) + "%";
        return '<div class="topic wide"><span>' + row[0] + '</span><div class="track"><span style="width:' + width + '%"></span></div><strong>' + label + "</strong></div>";
      }).join("");
    }

    function heatmap() {
      const days = state.window;
      let hours = '<div></div>' + Array.from({ length: 24 }, (_, hour) => '<div class="hlabel">' + (hour % 3 === 0 ? hour : "") + "</div>").join("");
      const rows = DAYS.map((name, dow) => {
        const cells = Array.from({ length: 24 }, (_, hour) => {
          const rate = failRate(dow + 1, hour, days);
          return '<div class="cell" style="background:' + heatColor(rate) + '" title="' + name + " " + hour + ":00 · " + rate.toFixed(2) + '%"></div>';
        }).join("");
        return '<div class="dlabel">' + name + "</div>" + cells;
      }).join("");
      const totals = Array.from({ length: 24 }, (_, hour) => DAYS.reduce((sum, _, dow) => sum + volume(dow + 1, hour), 0));
      const max = Math.max(...totals);
      const bars = totals.map((value) => '<i style="height:' + Math.max(4, (value / max) * 100) + '%" title="' + value.toLocaleString() + ' messages"></i>').join("");
      const failCounts = totals.map((value) => Math.round(value * (state.window === 7 ? 0.018 : 0.015)));
      const maxFail = Math.max(...failCounts, 1);
      const stacks = failCounts.map((count) => {
        const height = (count / maxFail) * 72;
        const parts = [
          ["#cf222e", 0.55],
          ["#f49d1a", 0.25],
          ["#909090", 0.12],
          ["#334bfa", 0.08]
        ];
        return "<b>" + parts.map((part) => '<span style="height:' + Math.max(1, height * part[1]).toFixed(1) + "px;background:" + part[0] + '"></span>').join("") + "</b>";
      }).join("");
      return '<div class="heat-wrap"><div class="heat">' + hours + rows + '</div><div class="bars">' + bars + '</div><div class="stack">' + stacks + "</div></div>" +
        legend([["Under 1%", "#eaf6ed"], ["1–2%", "#fef5e8"], ["2–3%", "#f8d7a8"], ["3%+", "#f4c7cb"], ["Error", "#cf222e"], ["Timeout", "#f49d1a"], ["Empty", "#909090"], ["Silent", "#334bfa"]]);
    }

    function kpiCard(href, label, valueHtml, sub, tip) {
      return '<a class="kpi" href="' + href + '"><span>' + label + "</span>" + valueHtml + "<em>" + sub + '</em><p class="tip">' + tip + "</p></a>";
    }

    function render() {

        "</div>" +

        "</div>" +

        "</div></section>" +

            { name: "Combined", color: "#334bfa", values: [8.2, 7.6, 7.1, 6.9, 7.4, 6.5, 6.2, 6.8] },

            { name: "Regenerate", color: "#f49d1a", values: [6.6, 6.2, 5.8, 5.7, 6.0, 5.4, 5.2, 5.6] }
          ], ["8 Sep", "27 Oct"]) + legend([["Combined", "#334bfa"], ["Thumbs-down", "#cf222e"], ["Regenerate", "#f49d1a"]]) + "</article>" +
          '<article class="tile"><h3>Thumbs-down by topic</h3>' + topics("feedback") + "</article></div></section>" +
        '<section class="section" id="quality"><h2>Conversation quality</h2><p class="note">Bounce is a chat that stops after the first reply. Resolved means Astra gave a usable answer and the user did not mark it down or regenerate. No answer is separate from a technical failure.</p><div class="tiles two">' +

          '<article class="tile"><h3>Sessions per user</h3>' + chart([{ name: "Sessions", color: "#334bfa", values: [1.6, 1.7, 1.8, 1.9, 2.0, 2.1, 2.3, 2.4] }], ["8 Sep", "27 Oct"]) + "</article>" +
        '</div><div class="tiles two">' +
          '<article class="tile"><h3>Messages per conversation</h3>' + shareBars([["1 message", 22.6], ["2–3 messages", 41.0], ["4–6 messages", 24.0], ["7 or more", 12.4]]) + '<p class="note">Median is 3. A pile-up at one message is the bounce rate.</p></article>' +

          '<article class="tile"><h3>Most active users</h3><table class="plain"><thead><tr><th>User</th><th>Organization</th><th class="num">This week</th><th class="num">This month</th></tr></thead><tbody>' +

          '</tbody></table></article></section>' +
        '<section class="section" id="power"><h2>Power users</h2><p class="note">A power user clears all three bars in the month: 8 or more sessions, 24 or more queries, and a message on 8 or more days. Kenji Sato has 9 sessions, but only 18 queries and 7 active days, so he is not included.</p><div class="stats">' +

        '</div><div class="tiles two">' +
          '<article class="tile"><h3>How many, by month</h3>' + chart([{ name: "Power users", color: "#334bfa", values: [96, 112, 134, 158, 186] }], ["Jun", "Oct"]) + "</article>" +
          '<article class="tile"><h3>Where they work</h3>' + shareBars([["Meridian Home", 48], ["Other organizations", 44], ["Fellow Products", 31], ["Harbor & Co", 24], ["Northwind Trading", 18], ["Pacific Line", 12], ["Cedar Logistics", 9]], true) + '<p class="note">Count of power users in October.</p></article>' +
        '</div><article class="tile"><h3>Who qualifies</h3><table class="plain"><thead><tr><th>User</th><th>Organization</th><th class="num">Sessions</th><th class="num">Queries</th><th class="num">Days active</th><th>Mostly asks</th></tr></thead><tbody>' +
          POWER_USERS.map((row) => '<tr><td>' + row[0] + '</td><td class="muted">' + row[1] + '</td><td class="num">' + row[2] + '</td><td class="num">' + row[3] + '</td><td class="num">' + row[4] + '</td><td class="muted">' + row[5] + '</td></tr>').join("") +
          '</tbody></table><p class="note">October. Days active are days with at least one message. These five are the sample; 181 others also qualify.</p></article></section>' +
        '<section class="section" id="scope"><h2>Scope</h2><p class="note">A fresh chat starts with nothing selected. The user can add an organization, and a project or shipment. Opening Astra from a project selects that organization and project before the first message.</p><div class="tiles">' +
          '<article class="tile"><h3>How the chat started</h3>' + shareBars([["From a project", 38.0], ["User added a scope", 38.0], ["Nothing selected", 24.0]]) + '<p class="note">From a project means the organization and project were already selected. The other two are fresh chats.</p></article>' +
          '<article class="tile"><h3>What was selected</h3>' + shareBars([["Org and project", 56.0], ["No scope", 24.0], ["Org and shipment", 11.0], ["Org only", 9.0]]) + '<p class="note">Counted on the first message. Org and project includes chats opened from a project.</p></article>' +
          '<article class="tile"><h3>Scoped chats</h3>' + chart([{ name: "Scoped", color: "#334bfa", values: [62, 64, 66, 68, 70, 72, 74, 76] }], ["8 Sep", "27 Oct"]) + "</article>" +
        "</div></section>" +
        '<section class="section" id="topics"><h2>Topics</h2><p class="note">Share of classified conversations. Coverage is 97.4%.</p><div class="tiles two">' +
          '<article class="tile"><h3>This period</h3>' + topics("share") + "</article>" +
          '<article class="tile"><h3>Failure rate by topic</h3>' + topics("failure") + "</article></div></section>" +
        '<section class="section" id="queries"><h2>Queries</h2><p class="note">What people asked Astra, and who asked it. These rows are sample questions from the period.</p>' +
          '<article class="tile"><h3>Recent questions</h3><table class="plain queries"><thead><tr><th>User</th><th>Organization</th><th>Query</th><th>Topic</th></tr></thead><tbody>' +
          QUERIES.map((row) => '<tr><td>' + row[0] + '</td><td class="muted">' + row[1] + '</td><td>' + row[2] + '</td><td class="muted">' + row[3] + '<div class="sub">' + row[4] + '</div></td></tr>').join("") +
          '</tbody></table></article>' +
          '<article class="tile"><h3>Who asks the most</h3><table class="plain"><thead><tr><th>User</th><th>Organization</th><th>Mostly asks</th><th class="num">Chats</th><th class="num">Messages</th></tr></thead><tbody>' +
          ASKERS.map((row) => '<tr><td>' + row[0] + '</td><td class="muted">' + row[1] + '</td><td class="muted">' + row[4] + '</td><td class="num">' + row[2] + '</td><td class="num">' + row[3] + '</td></tr>').join("") +
          '</tbody></table></article></section>';
    }

    function setWindow(days) {
      state.window = days;
      render();
      const section = document.getElementById("failures");
      if (section) section.scrollIntoView({ block: "start" });
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-go]");
      if (!target) return;
      if (target.dataset.go === "collapse") {
        document.getElementById("app").classList.toggle("is-collapsed");
      }
      if (target.dataset.go === "toggle") {
        target.closest("[data-group]").classList.toggle("is-open");
      }
    });

    render();
  </script>
</body>
</html>
